<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina Mecânica - Veículos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a href="principal.html" class="navbar-brand text-decoration-none">🔧 Oficina Mecânica</a>
            <a href="principal.html" class="btn btn-outline-light btn-sm">← Início</a>
        </div>
    </nav>

    <main class="container">
        <h1 class="h3 mb-4">Veículos</h1>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="h5 mb-3">Novo Veículo</h2>
                <form id="form-veiculo">
                    <div class="row g-2">
                        <div class="col-12 col-md-4">
                            <label for="veiculo-placa" class="form-label">Placa</label>
                            <input type="text" id="veiculo-placa" class="form-control" required>
                        </div>
                        <div class="col-12 col-md-4">
                            <label for="veiculo-modelo" class="form-label">Modelo</label>
                            <input type="text" id="veiculo-modelo" class="form-control" placeholder="Ex: Fiat Uno">
                        </div>
                        <div class="col-12 col-md-4">
                            <label for="veiculo-cliente" class="form-label">Cliente</label>
                            <select id="veiculo-cliente" class="form-select" required>
                                <option value="">Carregando clientes...</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary">Cadastrar</button>
                    </div>
                </form>
                <div id="mensagem-veiculo" class="mt-3"></div>
            </div>
        </div>
    </main>

    <script src="js/veiculos.js"></script>
</body>
</html>

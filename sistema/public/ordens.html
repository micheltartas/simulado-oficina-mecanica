<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina Mecânica - Ordens de Serviço</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a href="principal.html" class="navbar-brand text-decoration-none">🔧 Oficina Mecânica</a>
            <a href="principal.html" class="btn btn-outline-light btn-sm">← Início</a>
        </div>
    </nav>

    <main class="container">
        <h1 class="h3 mb-4">Ordens de Serviço</h1>

        <div id="mensagem-ordens" class="text-muted">Carregando ordens de serviço...</div>
        <table class="table table-hover d-none" id="tabela-ordens">
            <thead>
                <tr>
                    <th>Data de abertura</th>
                    <th>Veículo</th>
                    <th>Placa</th>
                    <th>Cliente</th>
                    <th>Telefone do cliente</th>
                    <th>Descrição</th>
                    <th class="tabela-acoes">Ações</th>
                </tr>
            </thead>
            <tbody id="corpo-tabela-ordens"></tbody>
        </table>
    </main>

    <script src="js/ordens.js"></script>
</body>
</html>
